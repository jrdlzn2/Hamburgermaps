<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Rutas a Google Maps por Dibujo</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f7f6;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        #map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .control-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #btn-draw {
            background-color: #3498db;
            color: white;
        }

        #btn-draw.active {
            background-color: #e67e22;
        }

        #btn-clear {
            background-color: #e74c3c;
            color: white;
        }

        #btn-google {
            background-color: #2ecc71;
            color: white;
            display: none;
            text-decoration: none;
            line-height: normal;
            padding: 10px 18px;
            border-radius: 5px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        #btn-google:hover {
            background-color: #27ae60;
        }

        button:hover {
            opacity: 0.9;
        }

        .instruction {
            font-size: 0.9rem;
            color: #555;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>Trazador de Rutas Global para Google Maps</h1>
        <p>Dibuja a mano alzada sobre cualquier carretera del mundo</p>
    </header>

    <div id="map-container">
        <div id="map"></div>
        <div class="control-panel">
            <span id="status" class="instruction">Modo: Navegación libre</span>
            <button id="btn-draw">Activar Dibujo</button>
            <button id="btn-clear">Borrar Trazado</button>
            <a id="btn-google" href="#" target="_blank">Abrir en Google Maps</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inicializar el mapa centrado en una ubicación por defecto (ej. Madrid, España)
        const map = L.map('map').setView([40.4168, -3.7038], 13);

        // Capa de mapa base (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let isDrawingEnabled = false;
        let isDrawing = false;
        let freehandPoints = [];
        let drawnLineLayer = null;
        let optimizedRouteLayer = null;

        const btnDraw = document.getElementById('btn-draw');
        const btnClear = document.getElementById('btn-clear');
        const btnGoogle = document.getElementById('btn-google');
        const statusText = document.getElementById('status');

        // 2. Control de activación del modo dibujo
        btnDraw.addEventListener('click', () => {
            isDrawingEnabled = !isDrawingEnabled;
            if (isDrawingEnabled) {
                btnDraw.textContent = 'Desactivar Dibujo';
                btnDraw.classList.add('active');
                statusText.textContent = 'Haz clic y arrastra sobre las carreteras';
                map.dragging.disable(); // Desactivar movimiento del mapa para dibujar con comodidad
            } else {
                btnDraw.textContent = 'Activar Dibujo';
                btnDraw.classList.remove('active');
                statusText.textContent = 'Modo: Navegación libre';
                map.dragging.enable();
            }
        });

        // 3. Eventos del mouse para dibujo a mano alzada
        map.on('mousedown', (e) => {
            if (!isDrawingEnabled) return;
            isDrawing = true;
            freehandPoints = [e.latlng];
            
            if (drawnLineLayer) map.removeLayer(drawnLineLayer);
            if (optimizedRouteLayer) map.removeLayer(optimizedRouteLayer);
            btnGoogle.style.display = 'none';

            drawnLineLayer = L.polyline(freehandPoints, { color: '#e74c3c', weight: 4 }).addTo(map);
        });

        map.on('mousemove', (e) => {
            if (!isDrawing || !isDrawingEnabled) return;
            freehandPoints.push(e.latlng);
            drawnLineLayer.setLatLngs(freehandPoints);
        });

        map.on('mouseup', async () => {
            if (!isDrawing || !isDrawingEnabled) return;
            isDrawing = false;
            
            if (freehandPoints.length > 2) {
                statusText.textContent = 'Procesando ruta sobre carreteras...';
                await processRouteToRoads(freehandPoints);
            }
        });

        // 4. Limpiar mapa
        btnClear.addEventListener('click', () => {
            if (drawnLineLayer) map.removeLayer(drawnLineLayer);
            if (optimizedRouteLayer) map.removeLayer(optimizedRouteLayer);
            freehandPoints = [];
            btnGoogle.style.display = 'none';
            statusText.textContent = isDrawingEnabled ? 'Haz clic y arrastra sobre las carreteras' : 'Modo: Navegación libre';
        });

        // 5. Procesar los puntos dibujados y ajustarlos a las carreteras usando OSRM
        async function processRouteToRoads(points) {
            try {
                // Reducir la cantidad de puntos para no saturar la API (tomar muestras cada ciertos puntos)
                const simplified = simplifyPoints(points, Math.max(1, Math.floor(points.length / 25)));
                
                // Construir la URL para OSRM (formato: lon,lat;lon,lat;...)
                const coordinatesString = simplified.map(p => `${p.lng},${p.lat}`).join(';');
                const url = `https://router.project-osrm.org/route/v1/driving/${coordinatesString}?overview=full&geometries=geojson`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const routeCoords = route.geometry.coordinates.map(c => [c[1], c[0]]); // Invertir a LatLng

                    // Dibujar la ruta ajustada a la carretera en color azul
                    optimizedRouteLayer = L.polyline(routeCoords, { color: '#2980b9', weight: 6, opacity: 0.8 }).addTo(map);

                    // Generar enlace optimizado para Google Maps
                    generateGoogleMapsLink(routeCoords);

                    statusText.textContent = '¡Ruta generada con éxito!';
                    btnGoogle.style.display = 'inline-block';
                } else {
                    statusText.textContent = 'No se encontró carretera cercana. Inténtalo de nuevo.';
                }
            } catch (error) {
                console.error(error);
                statusText.textContent = 'Error al conectar con el servicio de rutas.';
            }
        }

        // Función auxiliar para reducir puntos y evitar exceder límites de URLs
        function simplifyPoints(arr, step) {
            let result = [];
            for (let i = 0; i < arr.length; i += step) {
                result.push(arr[i]);
            }
            // Asegurar que se incluya el último punto
            if (result[result.length - 1] !== arr[arr.length - 1]) {
                result.push(arr[arr.length - 1]);
            }
            return result;
        }

        // 6. Generador de enlace para Google Maps con múltiples puntos intermedios (waypoints)
        function generateGoogleMapsLink(latlngs) {
            const origin = `${latlngs[0][0]},${latlngs[0][1]}`;
            const destination = `${latlngs[latlngs.length - 1][0]},${latlngs[latlngs.length - 1][1]}`;
            
            // Google Maps permite una cantidad limitada de waypoints en URL directas (tomamos muestras intermedias)
            const maxWaypoints = 8; 
            let waypointsArray = [];
            
            if (latlngs.length > 2) {
                const step = Math.floor(latlngs.length / (maxWaypoints + 1));
                for (let i = step; i < latlngs.length - 1; i += step) {
                    waypointsArray.push(`${latlngs[i][0]},${latlngs[i][1]}`);
                }
            }

            let googleUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;
            if (waypointsArray.length > 0) {
                googleUrl += `&waypoints=${waypointsArray.join('|')}`;
            }
            googleUrl += `&travelmode=driving`;

            btnGoogle.href = googleUrl;
        }
    </script>
</body>
</html>
