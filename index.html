<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Navegador de Cruces</title>
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Mapa */
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HUD Superior */
    .top-hud {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: rgba(20, 24, 33, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #00e676;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #00e676;
      border-radius: 50%;
      box-shadow: 0 0 10px #00e676;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    .metrics-bar {
      display: flex;
      gap: 16px;
      margin-top: 6px;
      font-size: 0.8rem;
      color: #a0aec0;
    }

    .metric span {
      color: #ffffff;
      font-weight: 700;
    }

    /* Marcadores personalizados en el mapa */
    .user-marker {
      width: 24px;
      height: 24px;
      background: #007aff;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(0, 122, 255, 0.9);
      position: relative;
    }

    .user-heading-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 12px solid #007aff;
    }

    .crossing-badge {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #ff3b30, #ff9500);
      color: white;
      border-radius: 50%;
      border: 3px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      box-shadow: 0 4px 18px rgba(255, 59, 48, 0.6);
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Panel inferior (Bottom Sheet) */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(18, 22, 30, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 12px));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      margin: 0 auto;
    }

    .sheet-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .sheet-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f7fafc;
    }

    .crossing-distance {
      font-size: 0.85rem;
      color: #ff9500;
      font-weight: 600;
    }

    /* Botones de acción con flechas */
    .turn-options-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .turn-btn {
      background: #252c3b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #cbd5e0;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .turn-btn:active {
      transform: scale(0.94);
      background: #007aff;
      color: #ffffff;
      border-color: #007aff;
    }

    .turn-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .turn-btn .label {
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
    }

    .turn-btn .exit-street {
      font-size: 0.65rem;
      color: #718096;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- HUD Superior -->
    <div class="top-hud">
      <div class="card">
        <div class="status-row">
          <div class="status-indicator">
            <div class="pulse-dot"></div>
            <span id="gps-status">Rastreando GPS</span>
          </div>
          <span id="heading-display" style="font-weight: 700; font-size: 0.85rem; color: #38bdf8;">0° N</span>
        </div>
        <div class="metrics-bar">
          <div class="metric">Velocidad: <span id="speed-val">0 km/h</span></div>
          <div class="metric">Precisión: <span id="acc-val">-- m</span></div>
        </div>
      </div>
    </div>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <!-- Barra Inferior de Opciones -->
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <span class="sheet-title">Opciones en Cruce #<span id="crossing-id-label">1</span></span>
        <span class="crossing-distance" id="crossing-distance-label">a 120m</span>
      </div>

      <div class="turn-options-grid" id="turn-options-container">
        <!-- Generado dinámicamente -->
      </div>
    </div>
  </div>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Variables de estado
    let map, userMarker, crossingMarker, routeLine;
    let currentCoords = { lat: 40.4168, lng: -3.7038 }; // Default Madrid
    let currentHeading = 0; // Grados
    let nextCrossingId = 1;

    // Inicializar mapa oscuro
    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([currentCoords.lat, currentCoords.lng], 18);

      // CartoDB Dark Matter tiles
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);

      // Icono de usuario con indicador de rumbo
      const userIcon = L.divIcon({
        className: 'user-icon-container',
        html: `
          <div id="user-puck" class="user-marker">
            <div class="user-heading-pointer"></div>
          </div>
        `,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      userMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon: userIcon }).addTo(map);

      // Generar el primer cruce adelante
      updateNextCrossing();
    }

    // Calcular destino a partir de distancia y rumbo (bearing)
    function computeOffset(lat, lng, distanceMeters, bearingDegrees) {
      const R = 6378137;
      const dLat = (distanceMeters * Math.cos(bearingDegrees * Math.PI / 180)) / R;
      const dLng = (distanceMeters * Math.sin(bearingDegrees * Math.PI / 180)) / (R * Math.cos(lat * Math.PI / 180));
      return {
        lat: lat + (dLat * 180 / Math.PI),
        lng: lng + (dLng * 180 / Math.PI)
      };
    }

    // Calcula y dibuja el siguiente cruce y sus salidas
    function updateNextCrossing() {
      const crossingDistance = 90; // metros adelante
      const crossingPos = computeOffset(currentCoords.lat, currentCoords.lng, crossingDistance, currentHeading);

      // Marcador del cruce (Redonda con número)
      const crossingIcon = L.divIcon({
        className: 'crossing-icon-wrapper',
        html: `<div class="crossing-badge">${nextCrossingId}</div>`,
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });

      if (crossingMarker) {
        crossingMarker.setLatLng([crossingPos.lat, crossingPos.lng]);
      } else {
        crossingMarker = L.marker([crossingPos.lat, crossingPos.lng], { icon: crossingIcon }).addTo(map);
      }

      // Dibujar línea guía hasta el cruce
      if (routeLine) {
        routeLine.setLatLngs([[currentCoords.lat, currentCoords.lng], [crossingPos.lat, crossingPos.lng]]);
      } else {
        routeLine = L.polyline([[currentCoords.lat, currentCoords.lng], [crossingPos.lat, crossingPos.lng]], {
          color: '#007aff',
          weight: 5,
          dashArray: '8, 8',
          opacity: 0.8
        }).addTo(map);
      }

      document.getElementById('crossing-id-label').innerText = nextCrossingId;
      document.getElementById('crossing-distance-label').innerText = `a ${crossingDistance} m`;

      renderTurnButtons();
    }

    // Renderizar botones con flechas según opciones de giro
    function renderTurnButtons() {
      const container = document.getElementById('turn-options-container');
      
      const options = [
        {
          id: 'u-turn',
          label: 'Cambio sent.',
          street: 'Retorno',
          svg: '<path d="M9 7v6a5 5 0 0 0 10 0V3h-2v10a3 3 0 0 1-6 0V7h3l-4-5-4 5h3z"/>'
        },
        {
          id: 'left',
          label: 'Giro Izq.',
          street: 'C/ Mayor',
          svg: '<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>'
        },
        {
          id: 'straight',
          label: 'Recto',
          street: 'Av. Principal',
          svg: '<path d="M12 4l-6 6h4v10h4V10h4z"/>'
        },
        {
          id: 'right',
          label: 'Giro Dcha.',
          street: 'C/ Sol',
          svg: '<path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>'
        }
      ];

      container.innerHTML = options.map(opt => `
        <button class="turn-btn" onclick="selectTurn('${opt.label}', '${opt.street}')">
          <svg viewBox="0 0 24 24">${opt.svg}</svg>
          <span class="label">${opt.label}</span>
          <span class="exit-street">${opt.street}</span>
        </button>
      `).join('');
    }

    // Acción al pulsar una opción
    window.selectTurn = function(action, street) {
      if (navigator.vibrate) navigator.vibrate(40);
      alert(`Has seleccionado: ${action} hacia "${street}". Avanzando al siguiente cruce...`);
      
      // Simular avance al siguiente cruce
      nextCrossingId++;
      currentCoords = computeOffset(currentCoords.lat, currentCoords.lng, 90, currentHeading);
      userMarker.setLatLng([currentCoords.lat, currentCoords.lng]);
      map.panTo([currentCoords.lat, currentCoords.lng]);
      updateNextCrossing();
    };

    // Actualizar orientación visual
    function updateHeadingUI(deg) {
      currentHeading = Math.round(deg);
      const cardinal = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'][Math.round(currentHeading / 45) % 8];
      document.getElementById('heading-display').innerText = `${currentHeading}° ${cardinal}`;

      const puck = document.getElementById('user-puck');
      if (puck) {
        puck.style.transform = `rotate(${currentHeading}deg)`;
      }
    }

    // Geolocalización y Sensores del Móvil
    function startTracking() {
      if (!('geolocation' in navigator)) {
        document.getElementById('gps-status').innerText = 'GPS no compatible';
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          currentCoords.lat = pos.coords.latitude;
          currentCoords.lng = pos.coords.longitude;
          
          const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
          const accuracy = Math.round(pos.coords.accuracy || 0);

          document.getElementById('speed-val').innerText = `${speed} km/h`;
          document.getElementById('acc-val').innerText = `${accuracy} m`;
          document.getElementById('gps-status').innerText = 'En vivo';

          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            updateHeadingUI(pos.coords.heading);
          }

          userMarker.setLatLng([currentCoords.lat, currentCoords.lng]);
          map.setView([currentCoords.lat, currentCoords.lng], 18);
          updateNextCrossing();
        },
        (err) => {
          console.warn('Error GPS:', err.message);
          document.getElementById('gps-status').innerText = 'Modo Demo (GPS estático)';
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );

      // Brújula digital del móvil (DeviceOrientation)
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          let heading = null;
          if (e.webkitCompassHeading) {
            heading = e.webkitCompassHeading; // iOS Safari
          } else if (e.alpha !== null) {
            heading = 360 - e.alpha; // Android Chrome
          }
          if (heading !== null) {
            updateHeadingUI(heading);
          }
        }, false);
      }
    }

    // Inicio automático
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      startTracking();
    });
  </script>
</body>
</html>
