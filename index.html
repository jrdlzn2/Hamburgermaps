<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Navegador de Vías y Cruces</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      color: #ffffff;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      background-color: #0d1117;
    }

    /* HUD Superior */
    .top-hud {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .card {
      background: rgba(15, 20, 28, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      flex: 1;
      margin-right: 10px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #00ff66;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff66;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    .metrics-bar {
      display: flex;
      gap: 16px;
      margin-top: 6px;
      font-size: 0.8rem;
      color: #8b949e;
    }

    .metric span {
      color: #ffffff;
      font-weight: 700;
    }

    .btn-saved-list {
      background: rgba(15, 20, 28, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      pointer-events: auto;
      display: none;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease;
    }

    .btn-saved-list.visible {
      display: flex;
    }

    .btn-saved-list:active {
      transform: scale(0.95);
    }

    /* Marcadores y Redondas del Cruce */
    .user-marker {
      width: 26px;
      height: 26px;
      background: #2f81f7;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(47, 129, 247, 0.9);
      position: relative;
    }

    .user-heading-pointer {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 13px solid #2f81f7;
    }

    .crossing-badge {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #f85149, #d29922);
      color: white;
      border-radius: 50%;
      border: 3px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      box-shadow: 0 4px 18px rgba(248, 81, 73, 0.7);
      animation: bounce 2s infinite ease-in-out;
    }

    .crossing-badge.saved {
      background: linear-gradient(135deg, #2f81f7, #3fb950);
      box-shadow: 0 4px 14px rgba(47, 129, 247, 0.6);
      animation: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Panel inferior (Bottom Sheet) */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(13, 17, 23, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 12px));
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      margin: 0 auto;
    }

    .sheet-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .sheet-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f0f6fc;
    }

    .crossing-distance {
      font-size: 0.85rem;
      color: #d29922;
      font-weight: 600;
    }

    .actions-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 0;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.92rem;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-accept {
      background: #238636;
      color: #ffffff;
    }

    .btn-reject {
      background: rgba(255, 255, 255, 0.1);
      color: #c9d1d9;
    }

    /* Opciones de giro */
    .turn-options-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .turn-btn {
      background: #21262d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #c9d1d9;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .turn-btn:active {
      transform: scale(0.94);
    }

    .turn-btn.selected {
      background: #238636 !important;
      border-color: #56d364 !important;
      color: #ffffff !important;
      box-shadow: 0 0 12px rgba(35, 134, 54, 0.6);
    }

    .turn-btn svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .turn-btn .label {
      font-size: 0.72rem;
      font-weight: 600;
      text-align: center;
    }

    .turn-btn .exit-street {
      font-size: 0.62rem;
      color: #8b949e;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .turn-btn.selected .exit-street {
      color: #d1d5db;
    }

    .empty-state {
      text-align: center;
      padding: 12px 0;
      color: #8b949e;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- HUD Superior -->
    <div class="top-hud">
      <div class="card">
        <div class="status-row">
          <div class="status-indicator">
            <div class="pulse-dot"></div>
            <span id="gps-status">Rastreando GPS</span>
          </div>
          <span id="heading-display" style="font-weight: 700; font-size: 0.85rem; color: #58a6ff;">0° N</span>
        </div>
        <div class="metrics-bar">
          <div class="metric">Velocidad: <span id="speed-val">0 km/h</span></div>
          <div class="metric">Aceptados: <span id="saved-count">0</span></div>
        </div>
      </div>
      
      <button class="btn-saved-list" id="btn-saved-modal" onclick="showSavedCrossingsList()">
        📍 Guardados
      </button>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Panel Inferior -->
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <span class="sheet-title" id="sheet-title-text">Buscando cruces...</span>
        <span class="crossing-distance" id="crossing-distance-label">--</span>
      </div>

      <div id="bottom-content-area">
        <div class="empty-state" id="sheet-message">Analizando calles y sentido de vías...</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, userMarker, activeCrossingMarker;
    let currentCoords = { lat: 40.4168, lng: -3.7038 };
    let currentHeading = 0;
    let crossingSequence = 1;
    let pendingCrossing = null;
    let currentSelectedOption = null;

    const savedMapMarkers = {};
    const crossingApproachLinesGroup = L.layerGroup(); // Capa para los 20m de vías concurrentes

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([currentCoords.lat, currentCoords.lng], 18);

      // Usamos CartoDB Dark Matter modificado para potenciar nombres de calles y contraste de vías
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd'
      }).addTo(map);

      crossingApproachLinesGroup.addTo(map);

      const userIcon = L.divIcon({
        className: 'user-icon-container',
        html: `
          <div id="user-puck" class="user-marker">
            <div class="user-heading-pointer"></div>
          </div>
        `,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });

      userMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon: userIcon }).addTo(map);

      loadPersistedCrossings();
      triggerNewCrossingDetection();
    }

    function computeOffset(lat, lng, distanceMeters, bearingDegrees) {
      const R = 6378137;
      const dLat = (distanceMeters * Math.cos(bearingDegrees * Math.PI / 180)) / R;
      const dLng = (distanceMeters * Math.sin(bearingDegrees * Math.PI / 180)) / (R * Math.cos(lat * Math.PI / 180));
      return {
        lat: lat + (dLat * 180 / Math.PI),
        lng: lng + (dLng * 180 / Math.PI)
      };
    }

    // Dibuja los primeros 20 metros de las vías que coinciden en el cruce (4 direcciones principales)
    function renderApproachingStreets(crossingLat, crossingLng) {
      crossingApproachLinesGroup.clearLayers();

      const angles = [0, 90, 180, 270]; // Representan los accesos cardinales/perpendiculares del cruce
      angles.forEach(angle => {
        // Punto de inicio (centro del cruce) y punto final a 20 metros de distancia
        const endPoint = computeOffset(crossingLat, crossingLng, 20, angle);

        // Línea resaltada con neón fluorescente contrastado para las vías
        const streetLine = L.polyline([[crossingLat, crossingLng], [endPoint.lat, endPoint.lng]], {
          color: '#3fb950', // Color verde neón brillante de alta visibilidad para vías
          weight: 6,
          opacity: 0.9,
          lineCap: 'round'
        });

        crossingApproachLinesGroup.addLayer(streetLine);
      });
    }

    function triggerNewCrossingDetection() {
      const crossingPos = computeOffset(currentCoords.lat, currentCoords.lng, 90, currentHeading);
      const crossingId = `crossing_${crossingSequence}`;

      const cached = getFromSessionCache(crossingId);

      pendingCrossing = cached || {
        id: crossingId,
        num: crossingSequence,
        lat: crossingPos.lat,
        lng: crossingPos.lng,
        distance: 90,
        options: [
          { id: 'u-turn', label: 'Cambio sent.', street: 'Retorno', svg: '<path d="M9 7v6a5 5 0 0 0 10 0V3h-2v10a3 3 0 0 1-6 0V7h3l-4-5-4 5h3z"/>' },
          { id: 'left', label: 'Giro Izq.', street: 'C/ Mayor (Única)', svg: '<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>' },
          { id: 'straight', label: 'Recto', street: 'Av. Central', svg: '<path d="M12 4l-6 6h4v10h4V10h4z"/>' },
          { id: 'right', label: 'Giro Dcha.', street: 'C/ Sol', svg: '<path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>' }
        ]
      };

      // Pintar los accesos de 20 metros de las vías en el cruce detectado
      renderApproachingStreets(pendingCrossing.lat, pendingCrossing.lng);

      if (cached) {
        displayTurnOptions(cached);
        return;
      }

      const tempIcon = L.divIcon({
        className: 'crossing-icon-wrapper',
        html: `<div class="crossing-badge">${pendingCrossing.num}</div>`,
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });

      if (activeCrossingMarker) map.removeLayer(activeCrossingMarker);
      activeCrossingMarker = L.marker([pendingCrossing.lat, pendingCrossing.lng], { icon: tempIcon }).addTo(map);

      document.getElementById('sheet-title-text').innerText = `¿Aceptar Cruce #${pendingCrossing.num}?`;
      document.getElementById('crossing-distance-label').innerText = `a ${pendingCrossing.distance}m`;

      const contentArea = document.getElementById('bottom-content-area');
      contentArea.innerHTML = `
        <div style="font-size:0.85rem; color:#8b949e; margin-bottom:12px;">Nueva intersección detectada con flujos de vía identificados.</div>
        <div class="actions-row">
          <button class="btn btn-reject" onclick="rejectCrossing()">Rechazar</button>
          <button class="btn btn-accept" onclick="acceptCrossing()">Aceptar Cruce</button>
        </div>
      `;
    }

    window.acceptCrossing = function() {
      if (!pendingCrossing) return;

      saveToSessionCache(pendingCrossing.id, pendingCrossing);
      createPermanentMarker(pendingCrossing);

      if (activeCrossingMarker) {
        map.removeLayer(activeCrossingMarker);
        activeCrossingMarker = null;
      }

      displayTurnOptions(pendingCrossing);
    };

    window.rejectCrossing = function() {
      if (activeCrossingMarker) {
        map.removeLayer(activeCrossingMarker);
        activeCrossingMarker = null;
      }
      crossingApproachLinesGroup.clearLayers();
      pendingCrossing = null;
      document.getElementById('sheet-title-text').innerText = 'Cruce omitido';
      document.getElementById('crossing-distance-label').innerText = '--';
      document.getElementById('bottom-content-area').innerHTML = `
        <div class="empty-state">Continuando en ruta...</div>
      `;
    };

    function createPermanentMarker(data) {
      if (savedMapMarkers[data.id]) return;

      const savedIcon = L.divIcon({
        className: 'crossing-saved-wrapper',
        html: `<div class="crossing-badge saved">${data.num}</div>`,
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });

      const marker = L.marker([data.lat, data.lng], { icon: savedIcon }).addTo(map);
      marker.bindPopup(`<b>Cruce #${data.num}</b><br>Vías guardadas correctamente.`);
      savedMapMarkers[data.id] = marker;
      updateSavedCount();
    }

    function displayTurnOptions(data) {
      document.getElementById('sheet-title-text').innerText = `Vías en Cruce #${data.num}`;
      document.getElementById('crossing-distance-label').innerText = `a ${data.distance}m`;

      const container = document.getElementById('bottom-content-area');
      container.innerHTML = `
        <div class="turn-options-grid" id="grid-options-${data.id}">
          ${data.options.map(opt => `
            <button class="turn-btn ${currentSelectedOption === opt.id ? 'selected' : ''}" 
                    onclick="handleOptionClick('${data.id}', '${opt.id}', '${opt.label}', '${opt.street}')">
              <svg viewBox="0 0 24 24">${opt.svg}</svg>
              <span class="label">${opt.label}</span>
              <span class="exit-street">${opt.street}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    window.handleOptionClick = function(crossingId, optId, label, street) {
      if (navigator.vibrate) navigator.vibrate(40);

      if (currentSelectedOption === optId) {
        if (confirm(`¿Estás seguro de que quieres desmarcar esta indicación (${label} - ${street})?`)) {
          currentSelectedOption = null;
          let cached = getFromSessionCache(crossingId);
          if (cached) displayTurnOptions(cached);
        }
      } else {
        currentSelectedOption = optId;
        let cached = getFromSessionCache(crossingId);
        if (cached) displayTurnOptions(cached);

        setTimeout(() => {
          crossingSequence++;
          currentCoords = computeOffset(currentCoords.lat, currentCoords.lng, 100, currentHeading);
          userMarker.setLatLng([currentCoords.lat, currentCoords.lng]);
          map.panTo([currentCoords.lat, currentCoords.lng]);
          currentSelectedOption = null;
          triggerNewCrossingDetection();
        }, 1200);
      }
    };

    window.showSavedCrossingsList = function() {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      let listStr = Object.values(stored).map(c => `• Cruce #${c.num} (${c.options.length} vías asociadas)`).join('\n');
      alert(`Cruces y vías memorizadas en la sesión:\n\n${listStr || 'Ninguno'}`);
    };

    function saveToSessionCache(key, data) {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      stored[key] = data;
      sessionStorage.setItem('nav_crossings', JSON.stringify(stored));
      updateSavedCount();
    }

    function getFromSessionCache(key) {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      return stored[key] || null;
    }

    function loadPersistedCrossings() {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      Object.values(stored).forEach(data => {
        createPermanentMarker(data);
      });
      updateSavedCount();
    }

    function updateSavedCount() {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      let count = Object.keys(stored).length;
      document.getElementById('saved-count').innerText = count;

      const btnSavedList = document.getElementById('btn-saved-modal');
      if (count > 0) {
        btnSavedList.classList.add('visible');
      } else {
        btnSavedList.classList.remove('visible');
      }
    }

    function updateHeadingUI(deg) {
      currentHeading = Math.round(deg);
      const cardinal = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'][Math.round(currentHeading / 45) % 8];
      document.getElementById('heading-display').innerText = `${currentHeading}° ${cardinal}`;

      const puck = document.getElementById('user-puck');
      if (puck) puck.style.transform = `rotate(${currentHeading}deg)`;
    }

    function startTracking() {
      if (!('geolocation' in navigator)) return;

      navigator.geolocation.watchPosition(
        (pos) => {
          currentCoords.lat = pos.coords.latitude;
          currentCoords.lng = pos.coords.longitude;
          
          const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
          document.getElementById('speed-val').innerText = `${speed} km/h`;
          document.getElementById('gps-status').innerText = 'En vivo';

          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            updateHeadingUI(pos.coords.heading);
          }

          userMarker.setLatLng([currentCoords.lat, currentCoords.lng]);
        },
        () => {
          document.getElementById('gps-status').innerText = 'Modo Demo';
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );

      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          let heading = e.webkitCompassHeading || (e.alpha !== null ? 360 - e.alpha : null);
          if (heading !== null) updateHeadingUI(heading);
        }, false);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      startTracking();
    });
  </script>
</body>
</html>
