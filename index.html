<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Navegador de Cruces</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HUD Superior */
    .top-hud {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: rgba(20, 24, 33, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #00e676;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #00e676;
      border-radius: 50%;
      box-shadow: 0 0 10px #00e676;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    .metrics-bar {
      display: flex;
      gap: 16px;
      margin-top: 6px;
      font-size: 0.8rem;
      color: #a0aec0;
    }

    .metric span {
      color: #ffffff;
      font-weight: 700;
    }

    /* Marcadores en el mapa */
    .user-marker {
      width: 24px;
      height: 24px;
      background: #007aff;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(0, 122, 255, 0.9);
      position: relative;
    }

    .user-heading-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 12px solid #007aff;
    }

    /* Redondas con número */
    .crossing-badge {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #ff3b30, #ff9500);
      color: white;
      border-radius: 50%;
      border: 3px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      box-shadow: 0 4px 18px rgba(255, 59, 48, 0.6);
      animation: bounce 2s infinite ease-in-out;
    }

    .crossing-badge.saved {
      background: linear-gradient(135deg, #007aff, #00c6ff);
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.5);
      animation: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Diálogo Modal de Aceptar/Rechazar Cruce */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.hidden {
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    .detection-card {
      background: #1a202c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-badge-preview {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #ff3b30, #ff9500);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      margin: 0 auto 16px;
      border: 3px solid white;
    }

    .detection-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .detection-desc {
      font-size: 0.88rem;
      color: #a0aec0;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px 0;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-accept {
      background: #00e676;
      color: #0b2e13;
    }

    .btn-reject {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    /* Panel inferior (Bottom Sheet) */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(18, 22, 30, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 12px));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      margin: 0 auto;
    }

    .sheet-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .sheet-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f7fafc;
    }

    .crossing-distance {
      font-size: 0.85rem;
      color: #ff9500;
      font-weight: 600;
    }

    /* Botones con flechas */
    .turn-options-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .turn-btn {
      background: #252c3b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #cbd5e0;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .turn-btn:active {
      transform: scale(0.94);
      background: #007aff;
      color: #ffffff;
    }

    .turn-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .turn-btn .label {
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
    }

    .turn-btn .exit-street {
      font-size: 0.65rem;
      color: #718096;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Estado de espera */
    .empty-state {
      text-align: center;
      padding: 16px 0;
      color: #718096;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- HUD Superior -->
    <div class="top-hud">
      <div class="card">
        <div class="status-row">
          <div class="status-indicator">
            <div class="pulse-dot"></div>
            <span id="gps-status">Rastreando GPS</span>
          </div>
          <span id="heading-display" style="font-weight: 700; font-size: 0.85rem; color: #38bdf8;">0° N</span>
        </div>
        <div class="metrics-bar">
          <div class="metric">Velocidad: <span id="speed-val">0 km/h</span></div>
          <div class="metric">Cruces guardados: <span id="saved-count">0</span></div>
        </div>
      </div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Modal de confirmación -->
    <div class="modal-backdrop" id="confirmation-modal">
      <div class="detection-card">
        <div class="modal-badge-preview" id="modal-crossing-num">1</div>
        <h2 class="detection-title">¡Cruce Detectado!</h2>
        <p class="detection-desc" id="modal-crossing-desc">Se ha detectado una intersección a 90m en tu trayectoria.</p>
        <div class="modal-actions">
          <button class="btn btn-reject" onclick="rejectCrossing()">Rechazar</button>
          <button class="btn btn-accept" onclick="acceptCrossing()">Aceptar Cruce</button>
        </div>
      </div>
    </div>

    <!-- Panel Inferior -->
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <span class="sheet-title" id="sheet-title-text">Cruce no seleccionado</span>
        <span class="crossing-distance" id="crossing-distance-label">--</span>
      </div>

      <div id="turn-options-container">
        <div class="empty-state">Acepta el cruce detectado para ver las salidas disponibles</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, userMarker, activeCrossingMarker, routeLine;
    let currentCoords = { lat: 40.4168, lng: -3.7038 };
    let currentHeading = 0;
    let crossingSequence = 1;
    let pendingCrossing = null;

    // Almacén en memoria de marcadores en el mapa
    const savedMapMarkers = {};

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([currentCoords.lat, currentCoords.lng], 18);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);

      const userIcon = L.divIcon({
        className: 'user-icon-container',
        html: `
          <div id="user-puck" class="user-marker">
            <div class="user-heading-pointer"></div>
          </div>
        `,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      userMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon: userIcon }).addTo(map);

      // Cargar cruces previos de la sesión si existen
      loadPersistedCrossings();

      // Disparar detección inicial
      triggerNewCrossingDetection();
    }

    function computeOffset(lat, lng, distanceMeters, bearingDegrees) {
      const R = 6378137;
      const dLat = (distanceMeters * Math.cos(bearingDegrees * Math.PI / 180)) / R;
      const dLng = (distanceMeters * Math.sin(bearingDegrees * Math.PI / 180)) / (R * Math.cos(lat * Math.PI / 180));
      return {
        lat: lat + (dLat * 180 / Math.PI),
        lng: lng + (dLng * 180 / Math.PI)
      };
    }

    // Simula detección o consulta de un cruce próximo
    function triggerNewCrossingDetection() {
      const crossingPos = computeOffset(currentCoords.lat, currentCoords.lng, 90, currentHeading);
      const crossingId = `crossing_${crossingSequence}`;

      // Verificar si ya está en caché de sesión
      const cached = getFromSessionCache(crossingId);

      pendingCrossing = cached || {
        id: crossingId,
        num: crossingSequence,
        lat: crossingPos.lat,
        lng: crossingPos.lng,
        distance: 90,
        options: [
          { label: 'Cambio sent.', street: 'Retorno', svg: '<path d="M9 7v6a5 5 0 0 0 10 0V3h-2v10a3 3 0 0 1-6 0V7h3l-4-5-4 5h3z"/>' },
          { label: 'Giro Izq.', street: 'C/ Mayor', svg: '<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>' },
          { label: 'Recto', street: 'Av. Central', svg: '<path d="M12 4l-6 6h4v10h4V10h4z"/>' },
          { label: 'Giro Dcha.', street: 'C/ Sol', svg: '<path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>' }
        ]
      };

      // Marcador temporal del cruce detectado
      const tempIcon = L.divIcon({
        className: 'crossing-icon-wrapper',
        html: `<div class="crossing-badge">${pendingCrossing.num}</div>`,
        iconSize: [42, 42],
        iconAnchor: [21, 21]
      });

      if (activeCrossingMarker) map.removeLayer(activeCrossingMarker);
      activeCrossingMarker = L.marker([pendingCrossing.lat, pendingCrossing.lng], { icon: tempIcon }).addTo(map);

      // Mostrar modal para decidir
      document.getElementById('modal-crossing-num').innerText = pendingCrossing.num;
      document.getElementById('modal-crossing-desc').innerText = `Se ha detectado el Cruce #${pendingCrossing.num} a ${pendingCrossing.distance}m.`;
      document.getElementById('confirmation-modal').classList.remove('hidden');
    }

    // ACEPTAR CRUCE
    window.acceptCrossing = function() {
      if (!pendingCrossing) return;

      // 1. Guardar en Session Storage para evitar llamadas redundantes
      saveToSessionCache(pendingCrossing.id, pendingCrossing);

      // 2. Fijar marcador permanente en el mapa
      createPermanentMarker(pendingCrossing);

      // 3. Quitar marcador temporal y modal
      if (activeCrossingMarker) {
        map.removeLayer(activeCrossingMarker);
        activeCrossingMarker = null;
      }
      document.getElementById('confirmation-modal').classList.add('hidden');

      // 4. Mostrar opciones en la barra inferior
      displayTurnOptions(pendingCrossing);
    };

    // RECHAZAR CRUCE
    window.rejectCrossing = function() {
      if (activeCrossingMarker) {
        map.removeLayer(activeCrossingMarker);
        activeCrossingMarker = null;
      }
      pendingCrossing = null;
      document.getElementById('confirmation-modal').classList.add('hidden');
      document.getElementById('sheet-title-text').innerText = 'Cruce omitido';
      document.getElementById('crossing-distance-label').innerText = '--';
      document.getElementById('turn-options-container').innerHTML = `
        <div class="empty-state">Continuando trayectoria...</div>
      `;
    };

    // Crea el marcador fijo con estilo guardado
    function createPermanentMarker(data) {
      if (savedMapMarkers[data.id]) return;

      const savedIcon = L.divIcon({
        className: 'crossing-saved-wrapper',
        html: `<div class="crossing-badge saved">${data.num}</div>`,
        iconSize: [42, 42],
        iconAnchor: [21, 21]
      });

      const marker = L.marker([data.lat, data.lng], { icon: savedIcon }).addTo(map);
      marker.bindPopup(`<b>Cruce #${data.num}</b><br>Guardado en sesión.`);
      savedMapMarkers[data.id] = marker;
      updateSavedCount();
    }

    // Renderizar opciones de giro
    function displayTurnOptions(data) {
      document.getElementById('sheet-title-text').innerText = `Opciones en Cruce #${data.num}`;
      document.getElementById('crossing-distance-label').innerText = `a ${data.distance}m`;

      const container = document.getElementById('turn-options-container');
      container.className = 'turn-options-grid';
      container.innerHTML = data.options.map(opt => `
        <button class="turn-btn" onclick="selectOption('${opt.label}', '${opt.street}')">
          <svg viewBox="0 0 24 24">${opt.svg}</svg>
          <span class="label">${opt.label}</span>
          <span class="exit-street">${opt.street}</span>
        </button>
      `).join('');
    }

    window.selectOption = function(label, street) {
      if (navigator.vibrate) navigator.vibrate(40);
      alert(`Has elegido: ${label} hacia ${street}`);
      
      // Simular avance al siguiente tramo
      crossingSequence++;
      currentCoords = computeOffset(currentCoords.lat, currentCoords.lng, 100, currentHeading);
      userMarker.setLatLng([currentCoords.lat, currentCoords.lng]);
      map.panTo([currentCoords.lat, currentCoords.lng]);

      // Detectar el siguiente cruce
      triggerNewCrossingDetection();
    };

    // --- Persistencia en SessionStorage ---
    function saveToSessionCache(key, data) {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      stored[key] = data;
      sessionStorage.setItem('nav_crossings', JSON.stringify(stored));
      updateSavedCount();
    }

    function getFromSessionCache(key) {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      return stored[key] || null;
    }

    function loadPersistedCrossings() {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      Object.values(stored).forEach(data => {
        createPermanentMarker(data);
      });
      updateSavedCount();
    }

    function updateSavedCount() {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      document.getElementById('saved-count').innerText = Object.keys(stored).length;
    }

    // Orientación y Brújula
    function updateHeadingUI(deg) {
      currentHeading = Math.round(deg);
      const cardinal = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'][Math.round(currentHeading / 45) % 8];
      document.getElementById('heading-display').innerText = `${currentHeading}° ${cardinal}`;

      const puck = document.getElementById('user-puck');
      if (puck) puck.style.transform = `rotate(${currentHeading}deg)`;
    }

    // Geolocalización
    function startTracking() {
      if (!('geolocation' in navigator)) return;

      navigator.geolocation.watchPosition(
        (pos) => {
          currentCoords.lat = pos.coords.latitude;
          currentCoords.lng = pos.coords.longitude;
          
          const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
          document.getElementById('speed-val').innerText = `${speed} km/h`;
          document.getElementById('gps-status').innerText = 'En vivo';

          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            updateHeadingUI(pos.coords.heading);
          }

          userMarker.setLatLng([currentCoords.lat, currentCoords.lng]);
          map.setView([currentCoords.lat, currentCoords.lng]);
        },
        () => {
          document.getElementById('gps-status').innerText = 'Modo Demo';
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );

      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          let heading = e.webkitCompassHeading || (e.alpha !== null ? 360 - e.alpha : null);
          if (heading !== null) updateHeadingUI(heading);
        }, false);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      startTracking();
    });
  </script>
</body>
</html>
