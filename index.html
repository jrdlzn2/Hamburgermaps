<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Navegador de Cruces</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* HUD Superior */
    .top-hud {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .card {
      background: rgba(20, 24, 33, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
      flex: 1;
      margin-right: 10px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #00e676;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #00e676;
      border-radius: 50%;
      box-shadow: 0 0 10px #00e676;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    .metrics-bar {
      display: flex;
      gap: 16px;
      margin-top: 6px;
      font-size: 0.8rem;
      color: #a0aec0;
    }

    .metric span {
      color: #ffffff;
      font-weight: 700;
    }

    /* Botón flotante superior derecho para cruces aceptados */
    .btn-saved-list {
      background: rgba(20, 24, 33, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      pointer-events: auto;
      display: none;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease;
    }

    .btn-saved-list.visible {
      display: flex;
    }

    .btn-saved-list:active {
      transform: scale(0.95);
    }

    /* Marcadores en el mapa */
    .user-marker {
      width: 24px;
      height: 24px;
      background: #007aff;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(0, 122, 255, 0.9);
      position: relative;
    }

    .user-heading-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 12px solid #007aff;
    }

    .crossing-badge {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #ff3b30, #ff9500);
      color: white;
      border-radius: 50%;
      border: 3px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      box-shadow: 0 4px 18px rgba(255, 59, 48, 0.6);
      animation: bounce 2s infinite ease-in-out;
    }

    .crossing-badge.saved {
      background: linear-gradient(135deg, #007aff, #00c6ff);
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.5);
      animation: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Panel inferior (Bottom Sheet) No Intrusivo */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(18, 22, 30, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 12px));
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      margin: 0 auto;
    }

    .sheet-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .sheet-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f7fafc;
    }

    .crossing-distance {
      font-size: 0.85rem;
      color: #ff9500;
      font-weight: 600;
    }

    /* Botones de acción general */
    .actions-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 0;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.92rem;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-accept {
      background: #00e676;
      color: #0b2e13;
    }

    .btn-reject {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    /* Cuadrícula de opciones de giro */
    .turn-options-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .turn-btn {
      background: #252c3b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #cbd5e0;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .turn-btn:active {
      transform: scale(0.94);
    }

    /* Estado seleccionado en verde */
    .turn-btn.selected {
      background: #00c853 !important;
      border-color: #69f0ae !important;
      color: #ffffff !important;
      box-shadow: 0 0 12px rgba(0, 200, 83, 0.4);
    }

    .turn-btn svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .turn-btn .label {
      font-size: 0.72rem;
      font-weight: 600;
      text-align: center;
    }

    .turn-btn .exit-street {
      font-size: 0.62rem;
      color: #a0aec0;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .turn-btn.selected .exit-street {
      color: #e8f5e9;
    }

    .empty-state {
      text-align: center;
      padding: 12px 0;
      color: #718096;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- HUD Superior -->
    <div class="top-hud">
      <div class="card">
        <div class="status-row">
          <div class="status-indicator">
            <div class="pulse-dot"></div>
            <span id="gps-status">Rastreando GPS</span>
          </div>
          <span id="heading-display" style="font-weight: 700; font-size: 0.85rem; color: #38bdf8;">0° N</span>
        </div>
        <div class="metrics-bar">
          <div class="metric">Velocidad: <span id="speed-val">0 km/h</span></div>
          <div class="metric">Aceptados: <span id="saved-count">0</span></div>
        </div>
      </div>
      
      <!-- Botón Superior Derecho (Visible si hay cruces aceptados) -->
      <button class="btn-saved-list" id="btn-saved-modal" onclick="showSavedCrossingsList()">
        📍 Ver Guardados
      </button>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Panel Inferior (Bottom Sheet) -->
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <span class="sheet-title" id="sheet-title-text">Buscando cruces...</span>
        <span class="crossing-distance" id="crossing-distance-label">--</span>
      </div>

      <div id="bottom-content-area">
        <div class="empty-state" id="sheet-message">Desplazándote hacia la siguiente intersección</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, userMarker, activeCrossingMarker;
    let currentCoords = { lat: 40.4168, lng: -3.7038 };
    let currentHeading = 0;
    let crossingSequence = 1;
    let pendingCrossing = null;
    let currentSelectedOption = null; // Almacena la opción marcada en verde actual

    const savedMapMarkers = {};

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([currentCoords.lat, currentCoords.lng], 18);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);

      const userIcon = L.divIcon({
        className: 'user-icon-container',
        html: `
          <div id="user-puck" class="user-marker">
            <div class="user-heading-pointer"></div>
          </div>
        `,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      userMarker = L.marker([currentCoords.lat, currentCoords.lng], { icon: userIcon }).addTo(map);

      loadPersistedCrossings();
      triggerNewCrossingDetection();
    }

    function computeOffset(lat, lng, distanceMeters, bearingDegrees) {
      const R = 6378137;
      const dLat = (distanceMeters * Math.cos(bearingDegrees * Math.PI / 180)) / R;
      const dLng = (distanceMeters * Math.sin(bearingDegrees * Math.PI / 180)) / (R * Math.cos(lat * Math.PI / 180));
      return {
        lat: lat + (dLat * 180 / Math.PI),
        lng: lng + (dLng * 180 / Math.PI)
      };
    }

    // Detectar un nuevo cruce y mostrar opciones de Aceptar/Rechazar en la parte baja
    function triggerNewCrossingDetection() {
      const crossingPos = computeOffset(currentCoords.lat, currentCoords.lng, 90, currentHeading);
      const crossingId = `crossing_${crossingSequence}`;

      const cached = getFromSessionCache(crossingId);

      pendingCrossing = cached || {
        id: crossingId,
        num: crossingSequence,
        lat: crossingPos.lat,
        lng: crossingPos.lng,
        distance: 90,
        options: [
          { id: 'u-turn', label: 'Cambio sent.', street: 'Retorno', svg: '<path d="M9 7v6a5 5 0 0 0 10 0V3h-2v10a3 3 0 0 1-6 0V7h3l-4-5-4 5h3z"/>' },
          { id: 'left', label: 'Giro Izq.', street: 'C/ Mayor', svg: '<path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>' },
          { id: 'straight', label: 'Recto', street: 'Av. Central', svg: '<path d="M12 4l-6 6h4v10h4V10h4z"/>' },
          { id: 'right', label: 'Giro Dcha.', street: 'C/ Sol', svg: '<path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>' }
        ]
      };

      // Si ya está guardado en sesión, lo mostramos directamente listo para usar
      if (cached) {
        displayTurnOptions(cached);
        return;
      }

      // Marcador temporal en el mapa (visible sin bloquear nada)
      const tempIcon = L.divIcon({
        className: 'crossing-icon-wrapper',
        html: `<div class="crossing-badge">${pendingCrossing.num}</div>`,
        iconSize: [42, 42],
        iconAnchor: [21, 21]
      });

      if (activeCrossingMarker) map.removeLayer(activeCrossingMarker);
      activeCrossingMarker = L.marker([pendingCrossing.lat, pendingCrossing.lng], { icon: tempIcon }).addTo(map);

      // Mostrar barra inferior de Aceptar / Rechazar
      document.getElementById('sheet-title-text').innerText = `¿Aceptar Cruce #${pendingCrossing.num}?`;
      document.getElementById('crossing-distance-label').innerText = `a ${pendingCrossing.distance}m`;

      const contentArea = document.getElementById('bottom-content-area');
      contentArea.innerHTML = `
        <div style="font-size:0.85rem; color:#a0aec0; margin-bottom:12px;">Se ha detectado una nueva intersección en tu trayectoria.</div>
        <div class="actions-row">
          <button class="btn btn-reject" onclick="rejectCrossing()">Rechazar</button>
          <button class="btn btn-accept" onclick="acceptCrossing()">Aceptar Cruce</button>
        </div>
      `;
    }

    // ACEPTAR CRUCE
    window.acceptCrossing = function() {
      if (!pendingCrossing) return;

      saveToSessionCache(pendingCrossing.id, pendingCrossing);
      createPermanentMarker(pendingCrossing);

      if (activeCrossingMarker) {
        map.removeLayer(activeCrossingMarker);
        activeCrossingMarker = null;
      }

      displayTurnOptions(pendingCrossing);
    };

    // RECHAZAR CRUCE
    window.rejectCrossing = function() {
      if (activeCrossingMarker) {
        map.removeLayer(activeCrossingMarker);
        activeCrossingMarker = null;
      }
      pendingCrossing = null;
      document.getElementById('sheet-title-text').innerText = 'Cruce omitido';
      document.getElementById('crossing-distance-label').innerText = '--';
      document.getElementById('bottom-content-area').innerHTML = `
        <div class="empty-state">Continuando trayectoria...</div>
      `;
    };

    // Crear marcador fijo persistente
    function createPermanentMarker(data) {
      if (savedMapMarkers[data.id]) return;

      const savedIcon = L.divIcon({
        className: 'crossing-saved-wrapper',
        html: `<div class="crossing-badge saved">${data.num}</div>`,
        iconSize: [42, 42],
        iconAnchor: [21, 21]
      });

      const marker = L.marker([data.lat, data.lng], { icon: savedIcon }).addTo(map);
      marker.bindPopup(`<b>Cruce #${data.num}</b><br>Guardado en sesión.`);
      savedMapMarkers[data.id] = marker;
      updateSavedCount();
    }

    // Mostrar opciones de giro tras aceptar
    function displayTurnOptions(data) {
      document.getElementById('sheet-title-text').innerText = `Opciones en Cruce #${data.num}`;
      document.getElementById('crossing-distance-label').innerText = `a ${data.distance}m`;

      const container = document.getElementById('bottom-content-area');
      container.innerHTML = `
        <div class="turn-options-grid" id="grid-options-${data.id}">
          ${data.options.map(opt => `
            <button class="turn-btn ${currentSelectedOption === opt.id ? 'selected' : ''}" 
                    onclick="handleOptionClick('${data.id}', '${opt.id}', '${opt.label}', '${opt.street}')">
              <svg viewBox="0 0 24 24">${opt.svg}</svg>
              <span class="label">${opt.label}</span>
              <span class="exit-street">${opt.street}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    // Manejar clic en una indicación (Verde y confirmación de desmarcar)
    window.handleOptionClick = function(crossingId, optId, label, street) {
      if (navigator.vibrate) navigator.vibrate(40);

      if (currentSelectedOption === optId) {
        // Si ya estaba seleccionada, preguntar si desea desmarcarla
        if (confirm(`¿Estás seguro de que quieres desmarcar esta indicación (${label} - ${street})?`)) {
          currentSelectedOption = null;
          let cached = getFromSessionCache(crossingId);
          if (cached) displayTurnOptions(cached);
        }
      } else {
        // Seleccionar en verde
        currentSelectedOption = optId;
        let cached = getFromSessionCache(crossingId);
        if (cached) displayTurnOptions(cached);

        // Opcional: Avanzar al siguiente tramo tras seleccionar opción de ruta
        setTimeout(() => {
          crossingSequence++;
          currentCoords = computeOffset(currentCoords.lat, currentCoords.lng, 100, currentHeading);
          userMarker.setLatLng([currentCoords.lat, currentCoords.lng]);
          map.panTo([currentCoords.lat, currentCoords.lng]);
          currentSelectedOption = null; // Reiniciar selección para el siguiente cruce
          triggerNewCrossingDetection();
        }, 1200);
      }
    };

    // Ver lista de todos los cruces guardados (al pulsar el botón superior derecho)
    window.showSavedCrossingsList = function() {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      let listStr = Object.values(stored).map(c => `• Cruce #${c.num} (Lat: ${c.lat.toFixed(4)}, Lng: ${c.lng.toFixed(4)})`).join('\n');
      alert(`Cruces guardados en la sesión actual:\n\n${listStr || 'Ninguno'}`);
    };

    // --- Persistencia SessionStorage ---
    function saveToSessionCache(key, data) {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      stored[key] = data;
      sessionStorage.setItem('nav_crossings', JSON.stringify(stored));
      updateSavedCount();
    }

    function getFromSessionCache(key) {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      return stored[key] || null;
    }

    function loadPersistedCrossings() {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      Object.values(stored).forEach(data => {
        createPermanentMarker(data);
      });
      updateSavedCount();
    }

    function updateSavedCount() {
      let stored = JSON.parse(sessionStorage.getItem('nav_crossings') || '{}');
      let count = Object.keys(stored).length;
      document.getElementById('saved-count').innerText = count;

      const btnSavedList = document.getElementById('btn-saved-modal');
      if (count > 0) {
        btnSavedList.classList.add('visible');
      } else {
        btnSavedList.classList.remove('visible');
      }
    }

    // GPS y Sensores de Orientación
    function updateHeadingUI(deg) {
      currentHeading = Math.round(deg);
      const cardinal = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'][Math.round(currentHeading / 45) % 8];
      document.getElementById('heading-display').innerText = `${currentHeading}° ${cardinal}`;

      const puck = document.getElementById('user-puck');
      if (puck) puck.style.transform = `rotate(${currentHeading}deg)`;
    }

    function startTracking() {
      if (!('geolocation' in navigator)) return;

      navigator.geolocation.watchPosition(
        (pos) => {
          currentCoords.lat = pos.coords.latitude;
          currentCoords.lng = pos.coords.longitude;
          
          const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
          document.getElementById('speed-val').innerText = `${speed} km/h`;
          document.getElementById('gps-status').innerText = 'En vivo';

          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            updateHeadingUI(pos.coords.heading);
          }

          userMarker.setLatLng([currentCoords.lat, currentCoords.lng]);
        },
        () => {
          document.getElementById('gps-status').innerText = 'Modo Demo';
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );

      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          let heading = e.webkitCompassHeading || (e.alpha !== null ? 360 - e.alpha : null);
          if (heading !== null) updateHeadingUI(heading);
        }, false);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      startTracking();
    });
  </script>
</body>
</html>
