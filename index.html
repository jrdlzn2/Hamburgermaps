<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gestor de Cruces y Sentidos</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #f8f9fa;
    }
    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
    }
    
    /* Panel superior de control */
    .top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: #0f172a;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .status-badge {
      font-size: 12px;
      color: #334155;
      font-weight: 600;
      background: #f1f5f9;
      padding: 6px 10px;
      border-radius: 6px;
    }

    /* Leyenda */
    .legend {
      display: flex;
      gap: 16px;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      border-top: 1px solid #e2e8f0;
      padding-top: 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .color-box {
      width: 14px;
      height: 5px;
      border-radius: 3px;
    }
    .dot-box {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Modal emergente inferior (Bottom Sheet) */
    .sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      z-index: 1000;
      border-radius: 18px 18px 0 0;
      padding: 16px 20px 24px;
      box-shadow: 0 -6px 24px rgba(0,0,0,0.18);
      transform: translateY(105%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 55vh;
      overflow-y: auto;
    }
    .sheet.active {
      transform: translateY(0);
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .sheet h3 {
      font-size: 16px;
      color: #0f172a;
      font-weight: 700;
    }
    .close-btn {
      background: #f1f5f9;
      border: none;
      font-size: 16px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
    }
    .sheet-subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 12px;
    }
    
    /* Lista interactiva de giros */
    .maneuver-item {
      display: flex;
      align-items: center;
      padding: 11px 8px;
      border-bottom: 1px solid #f1f5f9;
      gap: 12px;
      border-radius: 6px;
    }
    .maneuver-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: #16a34a;
      cursor: pointer;
    }
    .maneuver-label {
      font-size: 14px;
      color: #1e293b;
      font-weight: 500;
      flex: 1;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-row">
      <button id="fetchBtn" class="btn">Escanear zona actual</button>
      <span id="stats" class="status-badge">Cruces: 0</span>
    </div>
    <div class="legend">
      <div class="legend-item">
        <div class="color-box" style="background: #007bff;"></div>
        <span>1 Sentido (Azul)</span>
      </div>
      <div class="legend-item">
        <div class="color-box" style="background: #8a2be2;"></div>
        <span>2 Sentidos (Morado)</span>
      </div>
      <div class="legend-item">
        <div class="dot-box" style="background: #ff5722;"></div>
        <span>Pendiente</span>
      </div>
      <div class="legend-item">
        <div class="dot-box" style="background: #16a34a;"></div>
        <span>Listo</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <!-- Panel emergente del cruce -->
  <div id="sheet" class="sheet">
    <div class="sheet-header">
      <h3 id="sheetTitle">Cruce</h3>
      <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>
    <p class="sheet-subtitle" id="sheetSubtitle">Marca las trayectorias completadas:</p>
    <div id="maneuversList"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([40.4168, -3.7038], 16);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    map.locate({ setView: true, maxZoom: 16 });

    let junctionsData = JSON.parse(localStorage.getItem('saved_junctions') || '{}');
    
    const roadsLayer = L.layerGroup().addTo(map);
    const markersLayer = L.layerGroup().addTo(map);

    document.getElementById('fetchBtn').addEventListener('click', fetchJunctionsAndRoads);

    async function fetchJunctionsAndRoads() {
      const btn = document.getElementById('fetchBtn');
      btn.disabled = true;
      btn.innerText = "Descargando...";

      const bounds = map.getBounds();
      const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;

      // Usamos out geom; para obtener las geometrías y etiquetas directamente en la respuesta
      const query = `
        [out:json][timeout:25];
        (
          way["highway"~"^(primary|secondary|tertiary|residential|unclassified|living_street)$"](${bbox});
        );
        out geom;
      `;

      try {
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: query
        });
        const data = await response.json();
        processOverpassData(data);
      } catch (err) {
        alert("Error al conectar con OpenStreetMap. Reduce el área visible e inténtalo de nuevo.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Escanear zona actual";
      }
    }

    function processOverpassData(data) {
      roadsLayer.clearLayers();
      markersLayer.clearLayers();

      const nodeUsage = {};
      const nodesMap = {};

      data.elements.forEach(way => {
        if (!way.geometry) return;

        // Extraer coordenadas de la geometría de la vía
        const latlngs = way.geometry.map(pt => [pt.lat, pt.lon]);

        // Registrar uso de nodos para calcular intersecciones (cruces)
        way.geometry.forEach(pt => {
          // Usamos una clave de lat/lon redondeada para contar cruces exactos de nodos compartidos
          const nKey = `${pt.lat.toFixed(5)},${pt.lon.toFixed(5)}`;
          if (!nodesMap[nKey]) {
            nodesMap[nKey] = { lat: pt.lat, lon: pt.lon, count: 0, id: pt.id || Math.random() };
          }
          nodesMap[nKey].count++;
        });

        // Comprobar si es de un solo sentido
        const tags = way.tags || {};
        const isOneWay = (
          tags.oneway === 'yes' || 
          tags.oneway === '1' || 
          tags.oneway === '-1' || 
          tags.junction === 'roundabout'
        );

        // Dibujar la calle: Azul si es 1 sentido, Morado si es 2 sentidos
        L.polyline(latlngs, {
          color: isOneWay ? '#007bff' : '#8a2be2',
          weight: 5,
          opacity: 0.85,
          lineJoin: 'round'
        }).addTo(roadsLayer);
      });

      // Filtrar y pintar los cruces (nodos por donde pasan 2 o más calles)
      let count = 0;
      Object.values(nodesMap).forEach(node => {
        if (node.count >= 2) {
          count++;
          createJunctionMarker(node, node.count);
        }
      });

      document.getElementById('stats').innerText = `Cruces: ${count}`;
    }

    function createJunctionMarker(node, branchesCount) {
      const jId = `j_${node.lat.toFixed(5)}_${node.lon.toFixed(5)}`;
      
      if (!junctionsData[jId]) {
        const estimatedTurns = [];
        for (let i = 1; i <= Math.min(branchesCount + 1, 4); i++) {
          estimatedTurns.push(`Acceso ${i} → Giro Derecha`);
          estimatedTurns.push(`Acceso ${i} → Recto`);
          estimatedTurns.push(`Acceso ${i} → Giro Izquierda`);
        }
        junctionsData[jId] = {
          id: jId,
          lat: node.lat,
          lon: node.lon,
          maneuvers: estimatedTurns.map(m => ({ label: m, done: false }))
        };
      }

      const isCompleted = junctionsData[jId].maneuvers.length > 0 && junctionsData[jId].maneuvers.every(m => m.done);

      const marker = L.circleMarker([node.lat, node.lon], {
        radius: 7,
        fillColor: isCompleted ? "#16a34a" : "#ff5722",
        color: "#ffffff",
        weight: 2,
        fillOpacity: 0.95
      });

      marker.on('click', () => openJunctionSheet(jId, marker));
      markersLayer.addLayer(marker);
    }

    function openJunctionSheet(jId, markerRef) {
      const junction = junctionsData[jId];
      document.getElementById('sheetTitle').innerText = `Cruce (${junction.lat.toFixed(4)}, ${junction.lon.toFixed(4)})`;
      
      const listContainer = document.getElementById('maneuversList');
      listContainer.innerHTML = '';

      junction.maneuvers.forEach((maneuver, index) => {
        const item = document.createElement('div');
        item.className = 'maneuver-item';
        item.innerHTML = `
          <input type="checkbox" id="m_${index}" ${maneuver.done ? 'checked' : ''}>
          <label class="maneuver-label" for="m_${index}">${maneuver.label}</label>
        `;

        item.querySelector('input').addEventListener('change', (e) => {
          junction.maneuvers[index].done = e.target.checked;
          localStorage.setItem('saved_junctions', JSON.stringify(junctionsData));
          
          const allDone = junction.maneuvers.every(m => m.done);
          markerRef.setStyle({ fillColor: allDone ? "#16a34a" : "#ff5722" });
        });

        listContainer.appendChild(item);
      });

      document.getElementById('sheet').classList.add('active');
    }

    function closeSheet() {
      document.getElementById('sheet').classList.remove('active');
    }
  </script>
</body>
</html>
